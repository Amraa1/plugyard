name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: go build .

      - name: Run plugyard version
        run: ./plugyard version

  release-build:
    name: Release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Builds the six release archives without publishing them, so that a
      # change that breaks the release is caught before a tag is pushed.
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --snapshot --clean

      - name: Check the archives the install scripts and "plugyard update" expect
        run: |
          for name in plugyard_linux_amd64.tar.gz plugyard_linux_arm64.tar.gz                       plugyard_darwin_amd64.tar.gz plugyard_darwin_arm64.tar.gz                       plugyard_windows_amd64.zip plugyard_windows_arm64.zip checksums.txt; do
            test -f "dist/$name" || { echo "dist/$name is missing"; ls dist; exit 1; }
          done

      - name: Check install.sh
        run: sh -n install.sh

  image:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Built as the release builds it, and not published.
      - name: Build the image
        run: docker build -t plugyard:ci --build-arg VERSION=v0.0.0-ci .

      - name: Run it
        run: |
          test "$(docker run --rm plugyard:ci version)" = "v0.0.0-ci"
          docker run --rm --entrypoint plugyard plugyard:ci site validate
          test "$(docker inspect plugyard:ci --format '{{.Config.User}}')" != "" \
            && test "$(docker inspect plugyard:ci --format '{{.Config.User}}')" != "0" \
            && test "$(docker inspect plugyard:ci --format '{{.Config.User}}')" != "root"
